name: build-tauri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundles as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  release-nightly:
    name: Update Nightly Pre-release
    needs: build
    # Only run on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles/
          merge-multiple: false

      - name: Delete & recreate Nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          body: |
            **Nightly build** — automatically updated on every push to `main`.
            
            Commit: ${{ github.sha }}
            Built: ${{ github.run_id }}
          artifacts: "bundles/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
